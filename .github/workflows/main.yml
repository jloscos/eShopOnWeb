name: demo githubscript

on:
  workflow_dispatch:

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "exemple",
              body: "This issue was created by githubscript"
            });
      - run: |
          gh issue create --title "2nd issue" --body "issue create by github cli"
        env:
          GH_TOKEN: ${{github.token}}
          GH_REPO: ${{github.repository}}
          
