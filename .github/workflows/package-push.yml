name: publish nuget package

on: 
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6.1.0
      - name: set up dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.x
      - name: build
        run: |
          dotnet build ./src/BlazorShared --configuration Release
      - name: package
        run: |
          dotnet pack ./src/BlazorShared --configuration Release --version ${{inputs.version}} --output ./publish
      - name: push package
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          dotnet nuget push ./publish/*.nupkg --source "https://nuget.pkg.github.com/jloscos/index.json" --api-key $GITHUB_TOKEN
          
