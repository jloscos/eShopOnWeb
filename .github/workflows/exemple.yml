name: Exemple Workflow

on: 
  push:
    paths:
      - src/Web
    branches: 
      - main
  workflow_dispatch:
    inputs:
      exemple:
        type: string
        default: test
        required: false
      env:
        type: choice
        options:
          - dev
          - preprod
          - prod
          
  pull_request:
    branches:
      - main
    paths:
      - src/Web
    

jobs:
  exemple:
    runs-on: ubuntu-latest
    name: 'Deploy to ${{ inputs.env }}'
    steps:
      - uses: actions/checkout@v6.1.0
        name: Checkout the code
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.x
      - name: dotnet restore
        run: dotnet restore ./src/Web
      - name: build
        run: dotnet build ./src/Web --configuration Release
      - name: publish
        run: dotnet publish ./src/Web --configuration Release -o ./publish
      - name: upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: publish
        
