name: Exemple Workflow

on: 
  push:
    paths:
      - src/Web
    branches: 
      - main
  workflow_dispatch:
    inputs:
      exemple:
        type: string
        default: test
        required: false
      env:
        type: choice
        options:
          - dev
          - preprod
          - prod
          
  pull_request:
    branches:
      - main
    paths:
      - src/Web
    

jobs:
  build:
    runs-on: ubuntu-latest
    name: 'Deploy to ${{ inputs.env }}'
    env: 
      PROJECT_PATH: ./src/Web

    steps:
      - uses: actions/checkout@v6.1.0
        name: Checkout the code
      - name: build dotnet
        uses: ./.github/actions/dotnet-build
        with:
          dotnet-version: 10.x
          project: $PROJECT_PATH
      - name: run tests
        run: dotnet test ./tests/UnitTestss

      - name: publish
        run: dotnet publish $PROJECT_PATH --configuration Release -o ./publish
      - name: upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: publish

  deploy-dev:
    runs-on: ubuntu-latest
    name: Deploy to dev
    needs: build
    environment: Dev
    steps:
      - name: download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: web
          path: publish
      - name: Azure Login
        uses: Azure/login@v3.0.2
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}
      - name: Azure WebApp
        uses: Azure/webapps-deploy@v3.0.8
        with:
          app-name: eshoponweb-github
          package: publish
          resource-group-name: gh-200

